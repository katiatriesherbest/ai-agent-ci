name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/katiatriesherbest/ai-agent-ci:latest   # ALL LOWERCASE

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          GEMINI_API_KEY: dummy-key-for-ci
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $IMAGE .

      - name: Push Docker image
        run: docker push $IMAGE

  deploy:
    needs: test
    runs-on: [self-hosted, portfolio-deploy]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker pull --platform linux/amd64 $env:IMAGE

      - name: Deploy on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $existing = docker ps -aq --filter "name=^/ai-agent-app$"
          if ($existing) { docker rm -f ai-agent-app }
          docker run -d --platform linux/amd64 --name ai-agent-app -p 127.0.0.1:8000:8000 -e GEMINI_API_KEY=$env:GEMINI_API_KEY $env:IMAGE
          exit $LASTEXITCODE

      - name: Pull image on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: docker pull --platform linux/amd64 $IMAGE

      - name: Deploy on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          existing=$(docker ps -aq --filter "name=^/ai-agent-app$")
          if [ -n "$existing" ]; then docker rm -f ai-agent-app; fi
          docker run -d --platform linux/amd64 --name ai-agent-app -p 127.0.0.1:8000:8000 -e GEMINI_API_KEY="$GEMINI_API_KEY" $IMAGE